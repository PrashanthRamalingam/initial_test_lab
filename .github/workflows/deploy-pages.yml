name: Deploy NetDraw to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/network-diagram-generator-u96hpf
    paths:
      - 'network-diagram-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stamp asset URLs with the commit SHA so browsers can never mix a
      # new page with stale cached scripts (Pages caches assets ~10 min).
      - name: Cache-bust assets
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" network-diagram-app/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: network-diagram-app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
